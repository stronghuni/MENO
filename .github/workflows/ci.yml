name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you pull a Windows installer off a branch without cutting a tag.
  workflow_dispatch:

jobs:
  verify:
    name: typecheck + unit tests
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Skip native module install scripts up-front; @electron/rebuild handles
      # them next. The postinstall (electron-builder install-app-deps) also
      # runs @electron/rebuild but we re-run with -f for determinism.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -f

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Integration tests (downloads + URL reachability)
        run: npx tsx scripts/integration-test.mjs

  build-mac:
    name: build macOS DMG
    runs-on: macos-latest
    needs: verify
    # Only run on tags so we don't burn CI minutes on every push.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build:mac
        env:
          # Skip notarization in CI — handled separately when a developer
          # account secret is configured. Set CSC_LINK and APPLE_ID secrets
          # to enable signing.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: meeting-notes-mac
          path: dist/*.dmg
          retention-days: 14

  build-win:
    name: build Windows installer
    runs-on: windows-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # smart-whisper ships no prebuilds — `npm ci` compiles whisper.cpp from
      # source via node-gyp, so this needs the MSVC toolchain that
      # windows-latest carries. node-llama-cpp and ffmpeg-static fetch their
      # win32-x64 binaries here too; that's why the installer can't be built
      # from macOS. postinstall (electron-builder install-app-deps) then
      # rebuilds better-sqlite3/keytar/smart-whisper against the Electron ABI.
      - run: npm ci

      - run: npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: meno-win
          path: dist/*-setup.exe
          retention-days: 14
